<ui:composition template="template.xhtml"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:c="http://java.sun.com/jsp/jstl/core">

    <ui:define name="content">

      <h:form id="acctPosForm">

            <table>

                <tr>
                    <td align="center">
                        <p:commandLink ajax="false">
                            <p:graphicImage url="/images/pdf.png" width="44"/>
                            <p:dataExporter type="pdf" target="tableID" fileName="accountPositions" />
                        </p:commandLink>
                    </td>

                    <td align="center">
                        <p:commandLink ajax="false">
                            <p:graphicImage url="/images/xls.jpeg" width="44"/>
                            <p:dataExporter type="xlsx" target="tableID" fileName="accountPositions" />
                        </p:commandLink>
                    </td>
                </tr>

                <tr>

                    <td colspan="2">

                        <p:dataTable id="tableID" value="#{pc_SlomFinMain.accountPositionsList}" rowIndexVar="rowIndex"
                            var="acctPos" scrollable="true" scrollHeight="950" styleClass="dataTableStyle">

                		   <p:column style="width:3%" headerText="Num">
                			  <h:outputText value="#{rowIndex + 1}"/>
                		   </p:column>

                		   <p:column style="width:18%" headerText="Account Name" sortBy="#{acctPos.accountName}">
                			  <h:outputText value="#{acctPos.accountName}"/>
                		   </p:column>

                		   <p:column style="width:12%" headerText="Account Type" sortBy="#{acctPos.accountType}">
                			  <h:outputText value="#{acctPos.accountType}"/>
                		   </p:column>

                		   <p:column style="width:22%" headerText="Investment" sortBy="#{acctPos.investmentName}">
                			  <h:outputText value="#{acctPos.investmentName}"/>
                		   </p:column>

                		   <p:column style="width:15%" headerText="Units Owned" sortBy="#{acctPos.unitsOwned}">
                			   <h:outputText value="#{acctPos.unitsOwned}"/>
                		   </p:column>

                           <p:column style="width:15%" headerText="Current Price" sortBy="#{acctPos.investmentPrice}">
                			   <h:outputText value="#{acctPos.investmentPrice}">
                			       <f:convertNumber currencySymbol="$" type="currency" maxFractionDigits="2" />
                			  </h:outputText>
                		   </p:column>

                		   <p:column style="width:15%" headerText="Position Value" sortBy="#{acctPos.positionValue}">
                			   <h:outputText value="#{acctPos.positionValue}">
                			       <f:convertNumber currencySymbol="$" type="currency" maxFractionDigits="2" />
                			  </h:outputText>
                		   </p:column>

                		</p:dataTable>

                    </td>

                </tr>

            </table>

      </h:form>

    </ui:define>

</ui:composition>
